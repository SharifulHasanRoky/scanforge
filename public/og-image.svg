<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo -->
  <g transform="translate(80, 80)">
    <rect width="80" height="80" rx="18" fill="url(#brand)"/>
    <g fill="#ffffff">
      <rect x="18" y="18" width="16" height="16" rx="3"/>
      <rect x="46" y="18" width="16" height="16" rx="3"/>
      <rect x="18" y="46" width="16" height="16" rx="3"/>
      <rect x="42" y="42" width="8" height="8" rx="2"/>
      <rect x="54" y="42" width="8" height="8" rx="2"/>
      <rect x="42" y="54" width="8" height="8" rx="2"/>
      <rect x="54" y="54" width="8" height="8" rx="2"/>
    </g>
    <text x="100" y="55" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff">ScanForge</text>
  </g>

  <!-- Headline -->
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Create QR Codes &amp; Barcodes.</text>
  <text x="80" y="395" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#10b981">Free. In Seconds.</text>

  <!-- Subline -->
  <text x="80" y="470" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">12 QR types · 15 barcode formats · custom designer · bulk · PNG/SVG/PDF</text>

  <!-- Feature pills -->
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    <rect x="80" y="510" width="180" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="170" y="538" fill="#10b981" text-anchor="middle">No watermark</text>

    <rect x="280" y="510" width="160" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="360" y="538" fill="#10b981" text-anchor="middle">No signup</text>

    <rect x="460" y="510" width="200" height="44" rx="22" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="560" y="538" fill="#f59e0b" text-anchor="middle">No daily limits</text>

    <rect x="680" y="510" width="200" height="44" rx="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="780" y="538" fill="#10b981" text-anchor="middle">Browser-side</text>
  </g>

  <!-- URL -->
  <text x="80" y="600" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#64748b">qrandbarcodegenerator.vercel.app</text>
</svg>
